# CHIC-AI Test Automation Configuration
# Created: February 12, 2026
# Usage: Different environments (dev, staging, production)

[DEFAULT]
# Default values for all environments
timeout = 30000
screenshot_on_failure = true
video_on_failure = true
browser_type = chromium
viewport_width = 1280
viewport_height = 720
slow_mo = 0

[dev]
# Development/Local Environment
base_url = http://localhost:5173
headless = false
browser = chromium
viewport_width = 1280
viewport_height = 720
timeout = 30000
slow_mo = 2000
screenshot_on_failure = true
video_on_failure = true
log_level = DEBUG

[staging]
# Staging Environment
base_url = https://staging.chic-ai.com
headless = true
browser = chromium
viewport_width = 1920
viewport_height = 1080
timeout = 30000
slow_mo = 0
screenshot_on_failure = true
video_on_failure = true
log_level = INFO

[production]
# Production Environment (Read-only tests)
base_url = https://chic-ai.com
headless = true
browser = chromium
viewport_width = 1920
viewport_height = 1080
timeout = 30000
slow_mo = 0
screenshot_on_failure = true
video_on_failure = false
log_level = WARNING

[ci]
# CI/CD Environment (GitHub Actions, Jenkins, etc.)
base_url = http://localhost:5173
headless = true
browser = chromium
viewport_width = 1280
viewport_height = 720
timeout = 60000
slow_mo = 0
screenshot_on_failure = true
video_on_failure = true
log_level = INFO
parallel_workers = 4

# Browser Options
[browser]
chromium_args = --disable-dev-shm-usage,--no-sandbox
firefox_args =
webkit_args =

# Timeouts (milliseconds)
[timeouts]
default = 30000
navigation = 30000
action = 10000
assertion = 5000

# Retry Configuration
[retry]
max_retries = 2
retry_delay = 1000

# Selectors
[selectors]
file = config/selectors.json
