# CHIC-AI - Pytest Configuration
# Created: February 12, 2026

[pytest]
# Test Discovery
testpaths = testcases
python_files = test_*.py TC_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test Markers (for categorization)
markers =
    smoke: Smoke tests - critical functionality only
    regression: Full regression suite
    validation: Form validation tests
    security: Security and penetration tests
    ui: UI/UX tests
    performance: Performance tests
    critical: Critical priority tests
    high: High priority tests
    medium: Medium priority tests
    low: Low priority tests
    positive: Positive test scenarios
    negative: Negative test scenarios
    wip: Work in progress tests
    skip: Tests to skip

# Command Line Options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --code-highlight=yes
    --html=results/report.html
    --self-contained-html
    --maxfail=5
    -ra

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = results/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console Output
console_output_style = progress

# Coverage (if using pytest-cov)
# addopts = --cov=pages --cov=utils --cov-report=html --cov-report=term

# Timeout
timeout = 300

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Parallel Execution (requires pytest-xdist)
# Uncomment to enable: addopts = -n auto

# Minimum Python Version
minversion = 3.9

# Test Order
# Can be 'random' for randomized execution
# Requires pytest-random-order
# addopts = --random-order
